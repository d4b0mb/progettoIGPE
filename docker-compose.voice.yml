# Local speech servers for the voice assistant (speech to text and text to speech), as an override file.
# It adds services and adds variables to the backend; it changes nothing else in docker-compose.yml.
#
#   GPU (NVIDIA):  docker compose -f docker-compose.yml -f docker-compose.voice.yml --profile voice-gpu up -d
#   CPU only:      VOICE_STT_HOST=stt-cpu VOICE_TTS_HOST=tts-cpu \
#                  docker compose -f docker-compose.yml -f docker-compose.voice.yml --profile voice-cpu up -d
#   (PowerShell:   $env:VOICE_STT_HOST="stt-cpu"; $env:VOICE_TTS_HOST="tts-cpu"; docker compose ... --profile voice-cpu up -d)
#
# Use ONE profile at a time: the GPU and CPU services use the same two ports on this computer (8000 and 8880).
# Both ports are reachable from this computer only (127.0.0.1); the voice-lab scripts use them directly
# (voice-lab/candidates.json: speech to text http://localhost:8000, text to speech http://localhost:8880).
# The backend reaches the servers through the Docker network by service name.
#
# Without any --profile the two backend variables below still apply, so the backend would say voice is
# enabled but find no speech server (it should answer 503 on the voice endpoints). Only use this file together with a profile.
#
# ---------------------------------------------------------------------------------------------------------
# UNVERIFIED / UNKNOWN (nothing here was run; the four image tags were checked to exist, nothing else was):
#  1. UNVERIFIED: does the speaches CUDA image (ghcr.io/speaches-ai/speaches:latest-cuda) include GPU kernels for an
#     RTX 5080 (Blackwell, sm_120)? If it fails with "no kernel image is available for execution on the device"
#     (or similar), use the CPU profile for STT (VOICE_STT_HOST=stt-cpu with the stt-cpu service) and tell the developer.
#     The Kokoro tag latest-cu128 is the one meant for RTX 50-series cards; that is a claim of its maker, not tested here.
#  2. UNVERIFIED: the path of the Hugging Face cache INSIDE the speaches image. It is written below as
#     /home/ubuntu/.cache/huggingface/hub from memory of the speaches documentation. If models are downloaded again
#     after every restart, this path is wrong: check the speaches README / its own compose file.
#  3. UNKNOWN: whether the images contain curl or python, so NO healthcheck is defined. Add one only after checking
#     (for example with: docker compose ... exec stt-gpu sh -c "command -v curl"). Until then "up -d" returns before the
#     servers are ready; the first model load can take a while. Look at: docker compose ... logs -f stt-gpu tts-gpu
#  4. UNKNOWN: whether the speaches server downloads a model by itself on the first transcription request.
#     Do not rely on it: pre-download (see below).
#  5. UNKNOWN: Kokoro-FastAPI keeps its model files inside the image or downloads them on first start. No volume is
#     defined for it; if it downloads at start, the download is repeated when the container is re-created.
#  6. UNKNOWN: the other settings the backend will read for voice (model names, voice names, language mapping). Only the
#     three variables requested are set here. When the backend code defines more VOICE_* variables, add them below.
#  7. Docker Desktop on Windows needs the WSL 2 backend and a current NVIDIA driver for GPU containers.
#
# PRE-DOWNLOADING MODELS (so the first request is not slow or failing). Exact commands are NOT given because they were
# not verified:
#  - speaches (speech to text): the running server has an API call to download a model by its Hugging Face id, for
#    example Systran/faster-whisper-large-v3-turbo (the model in voice-lab/candidates.example.json). It is described in
#    the speaches documentation: check the project README for the exact call (from memory it is a POST to /v1/models/<id>;
#    UNVERIFIED). Downloaded files land in the volume voice-hf-cache.
#  - Kokoro-FastAPI (text to speech): check the project README (github.com/remsky/Kokoro-FastAPI) for how the Kokoro
#    model is obtained and whether the image already contains it.
# ---------------------------------------------------------------------------------------------------------

services:
  backend:
    environment:
      VOICE_ENABLED: "true"
      # ${VAR:-default}: GPU services by default; set VOICE_STT_HOST / VOICE_TTS_HOST to stt-cpu / tts-cpu for the CPU profile.
      VOICE_STT_URL: http://${VOICE_STT_HOST:-stt-gpu}:8000
      VOICE_TTS_URL: http://${VOICE_TTS_HOST:-tts-gpu}:8880

  # Speech to text, GPU: faster-whisper behind an OpenAI-style API (POST /v1/audio/transcriptions).
  stt-gpu:
    image: ghcr.io/speaches-ai/speaches:latest-cuda
    profiles: ["voice-gpu"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - voice-hf-cache:/home/ubuntu/.cache/huggingface/hub # UNVERIFIED path, see note 2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # Text to speech, GPU: Kokoro behind an OpenAI-style API (POST /v1/audio/speech). cu128 = for RTX 50-series (Blackwell).
  tts-gpu:
    image: ghcr.io/remsky/kokoro-fastapi-gpu:latest-cu128
    profiles: ["voice-gpu"]
    ports:
      - "127.0.0.1:8880:8880"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # CPU fallbacks: slower, no graphics card needed. Use these if a GPU image does not work (see note 1).
  stt-cpu:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    profiles: ["voice-cpu"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - voice-hf-cache:/home/ubuntu/.cache/huggingface/hub # UNVERIFIED path, see note 2
    restart: unless-stopped

  tts-cpu:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    profiles: ["voice-cpu"]
    ports:
      - "127.0.0.1:8880:8880"
    restart: unless-stopped

volumes:
  voice-hf-cache:
