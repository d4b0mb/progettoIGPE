# Local speech server for the voice assistant (listening and speaking), as an override file.
# One server does both: speaches (faster-whisper for listening, Kokoro for speaking), OpenAI-style API on port 8000.
# It adds a service and variables to the backend; it changes nothing else in docker-compose.yml.
#
#   GPU (NVIDIA):  docker compose -f docker-compose.yml -f docker-compose.voice.yml --profile voice-gpu up -d
#   CPU only:      VOICE_HOST=stt-cpu docker compose -f docker-compose.yml -f docker-compose.voice.yml --profile voice-cpu up -d
#   (PowerShell:   $env:VOICE_HOST="stt-cpu"; docker compose ... --profile voice-cpu up -d)
#
# Use ONE profile at a time (both use port 8000 on this computer, reachable from this computer only).
#
# Verified on the RTX 5080 (Blackwell): the CUDA image works; the models live in the volume voice-hf-cache.
# Download them once while online (the server is offline afterwards, see HF_HUB_OFFLINE):
#   curl.exe -X POST http://localhost:8000/v1/models/Systran%2Ffaster-whisper-small
#   curl.exe -X POST http://localhost:8000/v1/models/speaches-ai%2FKokoro-82M-v1.0-ONNX-fp16
#   curl.exe -X POST http://localhost:8000/v1/models/speaches-ai%2Fpiper-it_IT-paola-medium   (Italian voice in use)
# If a model is missing after a restart, run the download with HF_HUB_OFFLINE=0 once (edit it below), then switch it back.
# Check what is installed: curl.exe http://localhost:8000/v1/models

x-speaches-env: &speaches-env
  STT_MODEL_TTL: "-1"            # keep the models loaded (the default unloads them after 5 idle minutes: 15-26 s on the next request)
  TTS_MODEL_TTL: "-1"
  HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-1}"  # 1 = models are already in the volume, no contact with Hugging Face; set 0 only to download a model
  HF_HUB_DISABLE_TELEMETRY: "1"
  GRADIO_ANALYTICS_ENABLED: "False"
  DO_NOT_TRACK: "1"

services:
  backend:
    environment:
      VOICE_ENABLED: "true"
      VOICE_STT_URL: http://${VOICE_HOST:-stt-gpu}:8000
      VOICE_STT_MODEL: Systran/faster-whisper-small
      VOICE_TTS_URL: http://${VOICE_HOST:-stt-gpu}:8000
      VOICE_TTS_MODEL: speaches-ai/piper-it_IT-paola-medium
      VOICE_TTS_VOICE_IT: paola
      VOICE_TTS_VOICE_EN: paola # Piper model above is Italian only; English replies would be read with an Italian voice

  stt-gpu:
    image: ghcr.io/speaches-ai/speaches:latest-cuda
    profiles: ["voice-gpu"]
    ports:
      - "127.0.0.1:8000:8000"
    environment: *speaches-env
    volumes:
      - voice-hf-cache:/home/ubuntu/.cache/huggingface/hub
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  stt-cpu:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    profiles: ["voice-cpu"]
    ports:
      - "127.0.0.1:8000:8000"
    environment: *speaches-env
    volumes:
      - voice-hf-cache:/home/ubuntu/.cache/huggingface/hub
    restart: unless-stopped

volumes:
  voice-hf-cache:
