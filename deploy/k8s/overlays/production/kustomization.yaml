# Production: the real restaurant. Images are pinned to an exact build.
#   kubectl kustomize deploy/k8s/overlays/production
#   kubectl apply -k deploy/k8s/overlays/production     (after creating the namespace and the Secret)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ristomanager-production

resources:
  - ../../base

# "sha-REPLACE_ME" is a PLACEHOLDER that does not exist: replace both tags with an exact build
# (sha-xxxxxxx, as published by CI) before applying. Updating production means changing these
# two lines, so an update is a choice, not a surprise.
images:
  - name: ghcr.io/d4b0mb/ristomanager-backend
    newTag: sha-REPLACE_ME
  - name: ghcr.io/d4b0mb/ristomanager-frontend
    newTag: sha-REPLACE_ME

replicas:
  - name: frontend
    count: 2

patches:
  # Host name and certificate secret.
  - path: ingress-patch.yaml
    target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: ristomanager
  # A bit more CPU and memory than the base.
  - path: resources-patch.yaml
  # Private images (packages not public): create the "ghcr-pull" secret (see the README), then
  # remove the "#" in front of the next line.
  # - path: image-pull-secret-patch.yaml
