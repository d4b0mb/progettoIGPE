# OPTIONAL and NOT active by default. Only needed when the ghcr.io packages are private.
# 1. Create the pull secret in this namespace (see deploy/k8s/README.md, "Private images").
# 2. In kustomization.yaml remove the "#" in front of "- path: image-pull-secret-patch.yaml".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-pull
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-pull
