# JSON Patch (RFC 6902) applied to the Ingress. Replace the placeholder with your real staging host.
- op: replace
  path: /spec/rules/0/host
  value: staging.example.com
- op: replace
  path: /spec/tls/0/hosts/0
  value: staging.example.com
- op: replace
  path: /spec/tls/0/secretName
  value: ristomanager-staging-tls
