# The whole product on one machine:  docker compose up --build
#   web app   http://localhost:3000
#   API       http://localhost:8080 (this computer only)
# Other devices on the network: see docs/LOCAL_SERVER.md
# A demo restaurant is created on first start (see scripts/seed-demo.sh for the logins).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ristomanager}
      POSTGRES_USER: ${POSTGRES_USER:-ristomanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ristomanager}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-ristomanager_app}
    restart: unless-stopped
    # Only this computer can reach the database; other devices go through the web app.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Creates the restricted role the API connects as (first start only).
      - ./infra/postgres/01-app-role.sh:/docker-entrypoint-initdb.d/01-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-ristomanager}
      # The API runs as the restricted role so row-level security applies to it...
      DB_USER: ristomanager_app
      DB_PASSWORD: ${APP_DB_PASSWORD:-ristomanager_app}
      # ...while migrations run as the owner.
      FLYWAY_USER: ${POSTGRES_USER:-ristomanager}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-ristomanager}
      # Set a long random value in .env for anything beyond local use.
      JWT_SECRET: ${JWT_SECRET:-}
      # Plain HTTP on localhost, so the refresh cookie cannot be marked Secure here.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Local language model (Ollama running on the PC itself, outside Docker). Swap the model here or in .env.
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:11434}
      AI_MODEL: ${AI_MODEL:-qwen3.5:9b}
    # Lets the container reach the PC on Linux too (Docker Desktop already provides this name).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8080
    restart: unless-stopped
    # The only port other devices on the network need.
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Runs once, creates the demo restaurant, then exits. Safe to run again.
  seed:
    image: curlimages/curl:8.11.1
    entrypoint: ["sh", "/scripts/seed-demo.sh"]
    environment:
      API_URL: http://backend:8080
    volumes:
      - ./scripts:/scripts:ro
    depends_on:
      - backend
    restart: "no"

volumes:
  db-data:
