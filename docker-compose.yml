# Local development stack: `docker compose up --build`
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ristomanager}
      POSTGRES_USER: ${POSTGRES_USER:-ristomanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ristomanager}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-ristomanager}
      DB_USER: ${POSTGRES_USER:-ristomanager}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ristomanager}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
