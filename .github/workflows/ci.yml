name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build and tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Docker is preinstalled on the runner, so Testcontainers starts a real
      # PostgreSQL for the integration tests.
      - name: Verify (unit + integration tests)
        working-directory: backend
        run: ./mvnw -B verify

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # The frontend's API types are generated from the backend contract. If someone
      # changed the contract without regenerating, the committed types are stale.
      - name: API types are up to date with the contract
        run: |
          npm run api:types
          git diff --exit-code -- src/api/schema.d.ts

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.service }} image (not pushed yet)
        run: docker build --tag ristomanager-${{ matrix.service }}:ci ${{ matrix.service }}
