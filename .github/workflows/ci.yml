name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build and tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Docker is preinstalled on the runner, so Testcontainers starts a real
      # PostgreSQL for the integration tests.
      - name: Verify (unit + integration tests)
        working-directory: backend
        run: ./mvnw -B verify

  docker:
    name: Backend Docker image
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Build image (not pushed yet)
        run: docker build --tag ristomanager-backend:ci backend
