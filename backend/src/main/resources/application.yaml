spring:
  application:
    name: ristomanager-cloud
  # The API connects as the restricted role so row-level security applies to it.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ristomanager}
    username: ${DB_USER:ristomanager_app}
    password: ${DB_PASSWORD:ristomanager_app}
  # Migrations connect as the owner, which is allowed to create tables and policies.
  flyway:
    enabled: true
    url: ${FLYWAY_URL:${DB_URL:jdbc:postgresql://localhost:5432/ristomanager}}
    user: ${FLYWAY_USER:ristomanager}
    password: ${FLYWAY_PASSWORD:ristomanager}

app:
  version: "@project.version@"
  security:
    jwt-secret: ${JWT_SECRET:}
    access-ttl: 15m
    refresh-ttl: 14d
    cookie-secure: ${COOKIE_SECURE:false}

springdoc:
  # The machine-readable API description. Off unless asked for: it lists every
  # endpoint, which is useful to developers and not something to publish by default.
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
