server:
  # Behind the reverse proxy the real client address arrives in X-Forwarded-For; the activity log records it.
  forward-headers-strategy: framework

spring:
  application:
    name: ristomanager-cloud
  # The API connects as the restricted role so row-level security applies to it.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ristomanager}
    username: ${DB_USER:ristomanager_app}
    password: ${DB_PASSWORD:ristomanager_app}
  # Migrations connect as the owner, which is allowed to create tables and policies.
  flyway:
    enabled: true
    url: ${FLYWAY_URL:${DB_URL:jdbc:postgresql://localhost:5432/ristomanager}}
    user: ${FLYWAY_USER:ristomanager}
    password: ${FLYWAY_PASSWORD:ristomanager}
  # Photos of rooms are uploaded for the floor plan draft.
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB

app:
  version: "@project.version@"
  security:
    jwt-secret: ${JWT_SECRET:}
    access-ttl: 15m
    refresh-ttl: 14d
    cookie-secure: ${COOKIE_SECURE:false}
  retention:
    enabled: ${RETENTION_ENABLED:true}
    # Guest name, phone, email, notes and declared allergies are erased this many days after the visit.
    guest-data-days: ${GUEST_DATA_DAYS:90}
    # Entries of the activity log (which include IP addresses) are deleted after this many days.
    audit-days: ${AUDIT_DAYS:365}
  ai:
    # Local language model through Ollama. Everything stays on the restaurant's own machine.
    enabled: ${AI_ENABLED:true}
    base-url: ${AI_BASE_URL:http://localhost:11434}
    model: ${AI_MODEL:qwen3.5:9b}
    # Low on purpose: the assistant must be predictable, not creative.
    temperature: ${AI_TEMPERATURE:0.2}
    context-tokens: ${AI_CONTEXT_TOKENS:8192}
    # How long Ollama keeps the model in memory after the last request (avoids a slow reload).
    keep-alive: ${AI_KEEP_ALIVE:30m}
    # On: measured 44/50 against 29/50 off on the ai-eval requests, and it stopped inventing actions. Costs about 1 s.
    think: ${AI_THINK:true}
    connect-timeout: 3s
    request-timeout: ${AI_REQUEST_TIMEOUT:60s}
    # How much the one local model may be used: calls running at once, and requests one person may start per minute.
    limits:
      max-concurrent: ${AI_MAX_CONCURRENT:2}
      per-user-per-minute: ${AI_PER_USER_PER_MINUTE:12}

springdoc:
  # The machine-readable API description. Off unless asked for: it lists every
  # endpoint, which is useful to developers and not something to publish by default.
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
